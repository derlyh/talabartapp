<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalabartApp — Sistema de Gestión</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">

    <!-- Supabase JS SDK (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- QRCode.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>
<body>

    <!-- Botón menú mobile -->
    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰</button>

    <div class="app-layout" id="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span style="font-size:1.8rem;">🐴</span>
                <div>
                    <h1 style="font-size: 1.15rem; margin-bottom: 0;">TalabartApp</h1>
                    <small class="text-muted" style="font-size: 0.75rem;">Taller de Cuero</small>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">General</div>
                    <a href="#/dashboard" class="nav-link">
                        <span class="nav-icono">📊</span> Dashboard
                    </a>
                </div>

                <div class="nav-section" id="nav-operaciones">
                    <div class="nav-section-title">Operaciones</div>
                    <a href="#/inventario" class="nav-link">
                        <span class="nav-icono">📦</span> Inventario
                    </a>
                    <a href="#/ventas" class="nav-link">
                        <span class="nav-icono">🛒</span> Ventas
                    </a>
                    <a href="#/nueva-venta" class="nav-link">
                        <span class="nav-icono">➕</span> Nueva Venta (POS)
                    </a>
                    <a href="#/clientes" class="nav-link">
                        <span class="nav-icono">👥</span> Clientes
                    </a>
                    <a href="#/qr" class="nav-link">
                        <span class="nav-icono">📱</span> Cobro QR
                    </a>
                    <a href="#/caja" class="nav-link">
                        <span class="nav-icono">💵</span> Caja
                    </a>
                </div>

                <div class="nav-section" id="nav-produccion">
                    <div class="nav-section-title">Producción Artesanal</div>
                    <a href="#/productividad" class="nav-link">
                        <span class="nav-icono">🔨</span> Productividad
                    </a>
                    <a href="#/pagos" class="nav-link">
                        <span class="nav-icono">💰</span> Liquidación Pagos
                    </a>
                    <a href="#/trabajadores" class="nav-link">
                        <span class="nav-icono">🧑‍🏭</span> Trabajadores
                    </a>
                </div>
            </nav>

            <!-- Footer del Sidebar con Selector Rápido de Rol -->
            <div class="sidebar-footer" id="sidebar-footer" style="flex-direction: column; align-items: stretch; gap: var(--space-xs);">
                <div style="display: flex; align-items: center; gap: var(--space-sm); margin-bottom: 4px;">
                    <div class="avatar" id="user-avatar" style="width: 30px; height: 30px; font-size: 0.8rem;">A</div>
                    <div class="user-info" style="min-width: 0; flex: 1;">
                        <div class="user-nombre" id="user-nombre" style="font-size: 0.82rem; font-weight: 600;">Administrador</div>
                        <div class="user-rol text-muted" id="user-rol" style="font-size: 0.7rem;">Control Total</div>
                    </div>
                </div>

                <!-- Selector de Rol al vuelo -->
                <div>
                    <label for="selector-rol-rapido" style="font-size: 0.7rem; color: var(--color-text-muted); margin-bottom: 2px;">Cambiar Rol de Prueba:</label>
                    <select id="selector-rol-rapido" style="font-size: 0.8rem; padding: 4px 8px; background: var(--color-surface-2); border-color: var(--color-border); height: auto;">
                        <option value="admin">👑 Administrador</option>
                        <option value="vendedor">🛒 Vendedor</option>
                        <option value="trabajador">🔨 Artesano</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Contenido principal -->
        <main class="main-content" id="app-content">
            <div class="loading-contenedor">
                <div class="spinner spinner-lg"></div>
                <p>Cargando TalabartApp...</p>
            </div>
        </main>

    </div>

    <!-- Entry point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
